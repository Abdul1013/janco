services:
  - type: web
    name: janco-backend
    env: docker
    plan: starter
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: janco-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: UVICORN_WORKERS
        value: "2"
      - key: REMINDERS_ENABLED
        value: "false"

databases:
  - name: janco-db
    databaseName: janco_prod
    plan: starter
