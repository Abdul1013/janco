# ─────────────────────────────────────────────────────────────────────────────
# JANCO — Local Development Stack
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   docker compose up          — start API + Redis
#   docker compose up --build  — rebuild after dependency changes
#   docker compose down        — stop and remove containers
#
# The API uses backend/.env for environment variables.
# Redis is ephemeral (no persistence) — suitable for local dev.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: janco-backend:dev
    container_name: janco_api
    env_file:
      - ./backend/.env
    environment:
      # Override Redis URL so the backend connects to the compose Redis service
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
      UVICORN_WORKERS: "1"   # Single worker in dev for easier debugging
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # Mount source so code changes are reflected without a rebuild (dev only)
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Redis (rate limiter, pricing cache, pub/sub) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: janco_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
